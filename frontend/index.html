<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- Tab icon: the lavender "m" sticker; PNG/ICO for browsers without SVG icons (Safari).
         ?v= busts browsers' sticky favicon cache — bump it whenever the icons change. -->
    <link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png?v=5" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.ico?v=5" sizes="any">
    <!-- Home-screen icon (iPhone "Add to Home Screen", Android/Chrome install). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
    <link rel="manifest" href="/site.webmanifest?v=5">
    <!-- Opened from the Home Screen: a full-screen app; the page draws under the status bar /
         Dynamic Island (layouts pad with env(safe-area-inset-*)), so the menu reaches the top. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Merkis">
    <!-- App-like: no pinch or double-tap zoom (inputs are ≥16px, so iOS never needs to zoom them). -->
    <!-- No viewport-fit=cover in a Safari tab: iOS 26 Safari covers anything drawn under its bottom toolbar.
         Opened from the Home Screen (iOS 26 opens those as web apps) the script below adds it, so the
         paper ground and the top bar reach up under the clock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f3efe7">
    <meta name="description" content="Merkis.app">
    <title>Merkis.app</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme
        try { theme = localStorage.getItem('merkis-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        // Home Screen web app: draw under the status bar (.standalone moves content a little lower).
        if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
          document.documentElement.classList.add('standalone')
          var vp = document.querySelector('meta[name="viewport"]')
          if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', viewport-fit=cover')
        }
      })()
    </script>
    <!-- The ground colour before any CSS arrives: the Home Screen app opens on paper (or near-black), not a white flash. -->
    <style>html{background:#f3efe7}html[data-theme=dark]{background:#111113}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
