<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8">
    <!-- Tab icon: Turf Green tile with a Light Yellow "m"; PNG/ICO for browsers without SVG icons (Safari).
         ?v= busts browsers' sticky favicon cache — bump it whenever the icons change. -->
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png?v=3" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon.ico?v=3" sizes="any">
    <!-- Home-screen icon (iPhone "Add to Home Screen", Android/Chrome install). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <link rel="manifest" href="/site.webmanifest?v=3">
    <!-- Opened from the Home Screen: a full-screen app; the page draws under the status bar /
         Dynamic Island (layouts pad with env(safe-area-inset-*)), so the menu reaches the top. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Merkis">
    <!-- App-like: no pinch or double-tap zoom (inputs are ≥16px, so iOS never needs to zoom them). -->
    <!-- No viewport-fit=cover in a Safari tab: iOS 26 Safari covers anything drawn under its bottom toolbar.
         Opened from the Home Screen (iOS 26 opens those as web apps) the script below adds it, so the opaque
         top bar can reach under the clock — that's what stops iOS's blur over the top of the page. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1f15">
    <meta name="description" content="Merkis.app">
    <title>Merkis.app</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme
        try { theme = localStorage.getItem('merkis-theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        // Home Screen web app: draw under the status bar; .standalone styles cover it with an opaque strip.
        if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
          document.documentElement.classList.add('standalone')
          var vp = document.querySelector('meta[name="viewport"]')
          if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', viewport-fit=cover')
        }
        // Design (Settings → Design): the default one needs no attribute.
        try {
          var design = localStorage.getItem('merkis-design')
          if (design === 'teal' || design === 'ember') document.documentElement.dataset.design = design
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
